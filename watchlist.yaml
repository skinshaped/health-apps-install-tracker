# watchlist.yaml — control file for the daily install tracker.
# TRACKED SET each day = union( the Play chart(s) below , the apps[] list below ).
# Every tracked app gets an exact daily install snapshot (Play maxInstalls).

charts:
  - HEALTH_AND_FITNESS

chart_top_n: 100

# discovery-sweep.mjs only (monthly, NOT the daily path): a wider net to find
# apps with real volume that the daily tracker isn't watching.
discovery:
  charts:
    - { category: HEALTH_AND_FITNESS, collections: [TOP_FREE, GROSSING] }
    - { category: MEDICAL, collections: [TOP_FREE, GROSSING] }
  searches:
    - weight loss
    - diet plan
    - AI health coach
    - hair loss
    - skin doctor
    - pcos
    - gut health
    - diabetes care
    - period tracker
    - health coach hindi
    - weight loss hindi
    - fat loss diet
    - sexual wellness
    - weight gain

# Apps always tracked, whether or not they chart.
# cluster: ai-coach | ai-tracker | d2c-condition | fitness | utility | tail | wellness-content
apps:
  - { package: com.seekhoai.android, cluster: ai-coach, note: "Seekho Health" }
